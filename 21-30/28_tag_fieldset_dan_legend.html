<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertemuan 28</title>
</head>

<body>
    <h2>Ini adalah Pertemuan 28</h2>
    <form action="">
        <fieldset>
            <legend>Informasi Pribadi</legend>
            <p></p><label for="nama">Nama:</label>
            <input type="text" id="nama" name="nama"></p>

            <p><label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </p>

            <p><label for="password">Password:</label>
                <input type="password" id="password" name="password">
            </p>
        </fieldset>

        <fieldset>
            <legend>Preferensi Pribadi</legend>
            <p><label for="">Makanan : </label></p>
            <p><input type="checkbox" id="mie-ayam" name="makanan">Mie Ayam</p>
            <p><input type="checkbox" id="sate" name="makanan">Sate</p>
            <p><input type="checkbox" id="nasi-goreng" name="makanan">Nasi Goreng</p>

            <p><label for="">Minuman : </label>
                <input type="radio" id="minuman-panas" name="minuman" checked>Minuman Panas
                <input type="radio" id="minuman-dingin" name="minuman">Minuman Dingin
            </p>
        </fieldset>
    </form>
</body>

</html>
