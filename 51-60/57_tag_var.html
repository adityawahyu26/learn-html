<!DOCTYPE html>

<head>

    <title>Pertemuan 57</title>
</head>

<body>
    <h2>Ini adalah Pertemuan 57</h2>
    <p>Ini adalah rumus menghitung kecepatan <var>v</var> :</p>
    <p><var>v</var> = <var>d</var> / <var>t</var></p>
    <p>Di mana :</p>
    <ul>
        <li><var>v</var> = kecepatan (m/s)</li>
        <li><var>d</var> = jarak (m)</li>
        <li><var>t</var> = waktu (s)</li>
    </ul>
</body>
