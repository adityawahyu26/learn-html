<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertemuan 36</title>
</head>

<body>
    <h2>Ini adalah pertemuan 36</h2>
    <form action="">
        <p><label for="date">Tanggal : </label>
            <input type="date" id="date" name="date">
        </p>

        <p><label for="time">Waktu : </label>
            <input type="time" id="time" name="time">
        </p>

        <p><label for="datetime">Tanggal dan Waktu : </label>
            <input type="datetime-local" id="datetime" name="datetime">
        </p>

        <p><label for="month">Bulan dan Tahun : </label>
            <input type="month" id="month" name="month">
        </p>
    </form>
</body>

</html>
