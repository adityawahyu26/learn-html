<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertemuan 37</title>
</head>

<body>
    <h2>Ini adalah pertemuan 37</h2>
    <form action="">
        <p><label for="urutan">No. Urut : </label>
            <input type="number" id="urutan" name="urutan" hidden>
        </p>

        <p><label for="id">No. Id : </label>
            <input type="number" id="id" name="id" disabled>
        </p>

        <p><label for="nama">Nama : </label>
            <input type="text" id="nama" name="nama" autofocus>
        </p>

        <p><label for="email">Email : </label>
            <input type="email" id="email" name="email" autocomplete="off">
        </p>

        <button type="submit">Simpan</button>
    </form>
</body>

</html>
