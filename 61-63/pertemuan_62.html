<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertemuan 62</title>
</head>

<body>
    <h2>Ini adalah Pertemuan 62</h2>
    <form action="">
        <label for="football">Choose Your English Football Team : </label>
        <input type="text" placeholder="Choose or Type..." list="footballTeams">
        <datalist id="footballTeams">
            <option value="Arsenal">
            <option value="Chelsea">
            <option value="Liverpool">
            <option value="Manchester City">
            <option value="Manchester United">
        </datalist>
        <br>

        <label for="basketball">Choose Your NBA Basketball Team : </label>
        <input type="text" placeholder="Choose or Type..." list="basketballTeams">
        <datalist id="basketballTeams">
            <option value="Los Angeles Lakers">
            <option value="Boston Celtics">
            <option value="New York Knicks">
            <option value="Golden State Warriors">
            <option value="Chicago Bulls">
        </datalist>
        <br>

        <button type="submit">Pilih</button>
    </form>
</body>

</html>
