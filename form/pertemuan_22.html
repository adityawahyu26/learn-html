<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertemuan 22</title>
</head>

<body>
    <h2>Ini adalah Pertemuan 22</h2>
    <form action="">
        <p><label for="nama">Nama :</label></p>
        <input type="text" id="nama" placeholder="Masukkan nama Anda">

        <p><label for="password">Password :</label></p>
        <input type="password" id="password" placeholder="Masukkan password Anda">

        <p><label for="alamat">Alamat :</label></p>
        <textarea id="alamat" placeholder="Masukkan alamat Anda" rows="5" cols="80"></textarea>

        <p><button type="submit">Simpan</button></p>
    </form>
</body>

</html>
