<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertemuan 27</title>
</head>

<body>
    <h2>Ini adalah Pertemuan 27</h2>
    <form action="">
        <p><label for="nama">Nama : </label>
            <input type="text" id="nama" name="nama">
        </p>

        <p><label for="">Pembayaran : </label>
            <input type="radio" id="cash" name="pembayaran" checked>Cash
            <input type="radio" id="transfer" name="pembayaran">Transfer
        </p>

        <p><label for="">Menu Makanan : </label>
            <input type="checkbox" id="mie-ayam" name="menu">Mie Ayam
            <input type="checkbox" id="ayam-geprek" name="menu">Ayam Geprek
            <input type="checkbox" id="nasi-goreng" name="menu">Nasi Goreng
        </p>
    </form>
</body>

</html>
