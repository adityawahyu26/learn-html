<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertemuan 41</title>
</head>

<body>
    <h2>Ini adalah Pertemuan 41</h2>
    <form action="">
        <p><label for="fileInput">Masukkan File : </label>
            <input type="file" id="fileInput" name="fileInput">
        </p>

        <p><label for="fileInput">Masukkan Foto : </label>
            <input type="file" id="fileInput" name="fileInput" accept="image/*">
        </p>

        <p><label for="fileInput">Masukkan Video : </label>
            <input type="file" id="fileInput" name="fileInput" accept="video/*">
        </p>

        <p><label for="fileInput">Masukkan Audio : </label>
            <input type="file" id="fileInput" name="fileInput" accept="audio/*">
        </p>

        <button type="submit">Kirim</button>
    </form>
</body>

</html>
