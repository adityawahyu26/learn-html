<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertemuan 44</title>
</head>

<body>
    <h2 style="text-align: center;">Form Pendaftaran SMK</h2>
    <fieldset>
        <legend>Informasi Pribadi</legend>
        <p><label for="nama">Nama Lengkap : </label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan Nama Anda" required>
        </p>

        <p><label for="nik">Nomor Induk Kependudukan (NIK) : </label>
            <input type="number" id="nik" name="nik" placeholder="Masukkan NIK Anda" required>
        </p>

        <p><label for="nisn">Nomor Induk Siswa Nasional (NISN) : </label>
            <input type="number" id="nisn" name="nisn" placeholder="Masukkan NISN Anda" required>
        </p>

        <p><label for="tempat_lahir">Tempat Lahir : </label>
            <input type="text" id="tempat_lahir" name="tempat_lahir" placeholder="Masukkan Tempat Lahir" required>
        </p>

        <p><label for="tanggal_lahir">Tanggal Lahir : </label>
            <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>
        </p>

        <p><label for="jenis_kelamin">Jenis Kelamin : </label>
            <input type="radio" id="laki_laki" name="jenis_kelamin" value="Laki-laki" required checked>
            <label for="laki_laki">Laki-laki</label>
            <input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan" required>
            <label for="perempuan">Perempuan</label>
        </p>

        <p><label for="agama">Agama : </label>
            <select id="agama" name="agama" required>
                <option value="Islam">Islam</option>
                <option value="Kristen">Kristen</option>
                <option value="Katolik">Katolik</option>
                <option value="Hindu">Hindu</option>
                <option value="Budha">Budha</option>
                <option value="Konghucu">Konghucu</option>
            </select>
        </p>

        <p><label for="alamat">Alamat : </label></p>
        <p><textarea id="alamat" name="alamat" rows="4" cols="50" placeholder="Masukkan Alamat Anda"
                required></textarea></p>

        <p><label for="whatsapp">Nomor WhatsApp/HP : </label>
            <input type="tel" id="whatsapp" name="whatsapp" placeholder="Masukkan Nomor WA/HP" required>
        </p>
    </fieldset>
    <br>
    <fieldset>
        <legend>Kompetensi Keahlian</legend>
        <p><label for="kompetensi">Pilih Kompetensi Keahlian : </label>
            <select name="kompetensi" id="kompetensi" required>
                <option value="Rekayasa Perangkat Lunak">Rekayasa Perangkat Lunak</option>
                <option value="Teknik Komputer dan Jaringan">Teknik Komputer dan Jaringan</option>
                <option value="Multimedia">Multimedia</option>
                <option value="Otomatisasi dan Tata Kelola Perkantoran">Otomatisasi dan Tata Kelola Perkantoran</option>
            </select>
        </p>

        <p><label for="alternatif">Pilih Alternatif Kompetensi : </label>
            <select name="alternatif" id="alternatif" required>
                <option value="Rekayasa Perangkat Lunak">Rekayasa Perangkat Lunak</option>
                <option value="Teknik Komputer dan Jaringan">Teknik Komputer dan Jaringan</option>
                <option value="Multimedia">Multimedia</option>
                <option value="Otomatisasi dan Tata Kelola Perkantoran">Otomatisasi dan Tata Kelola Perkantoran</option>
            </select>
        </p>
    </fieldset>
    <br>
    <fieldset>
        <legend>Data Sekolah Asal</legend>
        <p><label for="nama_sekolah">Nama SMP/MTs Asal : </label>
            <input type="text" id="nama_sekolah" name="nama_sekolah" placeholder="Masukkan Nama Sekolah" required>
        </p>

        <p><label for="npsn">NPSN Sekolah Asal : </label>
            <input type="number" id="npsn" name="npsn" placeholder="Masukkan NPSN Sekolah" required>
        </p>

        <p><label for="tahun_lulus">Tahun Lulus : </label>
            <input type="number" id="tahun_lulus" name="tahun_lulus" placeholder="Masukkan Tahun Lulus" required>
        </p>
    </fieldset>
    <br>
    <fieldset>
        <legend>Informasi Orang Tua / Wali</legend>
        <p><label for="nama_ortu">Nama Orang Tua / Wali : </label>
            <input type="text" id="nama_ortu" name="nama_ortu" placeholder="Masukkan Nama Orang Tua" required>
        </p>

        <p><label for="pekerjaan_ortu">Pekerjaan Orang Tua / Wali : </label>
            <input type="text" id="pekerjaan_ortu" name="pekerjaan_ortu" placeholder="Masukkan Pekerjaan Orang Tua"
                required>
        </p>

        <p><label for="penghasilan_ortu">Penghasilan Orang Tua / Wali : </label>
            <input type="number" id="penghasilan_ortu" name="penghasilan_ortu"
                placeholder="Masukkan Penghasilan Orang Tua" required>
        </p>

        <p><label for="whatsapp_ortu">Nomor WhatsApp Orang Tua / Wali : </label>
            <input type="tel" id="whatsapp_ortu" name="whatsapp_ortu" placeholder="Masukkan Nomor WA/HP Orang Tua"
                required>
        </p>
    </fieldset>
    <br>
    <fieldset>
        <p><label for="foto">Upload Foto Calon Siswa : </label></p>
        <p><input type="file" id="foto" name="foto" accept="image/*" required></p>
    </fieldset>
    <br>
    <button type="submit">Daftar</button>
    <br>
</body>

</html>
